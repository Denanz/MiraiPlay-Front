<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      /* Apply saved accent theme before paint (no colour flash) */
      (function(){try{var s=document.documentElement.style,m={'--accent-rgb':'th_accent','--accent-soft-rgb':'th_accent-soft','--accent-dim-rgb':'th_accent-dim'};for(var k in m){var v=localStorage.getItem(m[k]);if(v)s.setProperty(k,v);}}catch(e){}try{document.documentElement.setAttribute('data-design',localStorage.getItem('miraihub_design')==='modern'?'modern':'legacy');}catch(e){}})();
    </script>
    <meta name="theme-color" content="#07060b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MiraiHub" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>MiraiHub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
